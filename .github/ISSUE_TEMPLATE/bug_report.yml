name: Bug report
description: Something on resource-base.com is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page
      placeholder: https://resource-base.com/…
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 141 on macOS, Safari on iPhone
